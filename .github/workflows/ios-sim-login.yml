# iOS 시뮬레이터 로그인 재현 시험 — 빌드 전용 공개 저장소(Kkumakkuma/connectrip-ios) (2026-10-26)
#
# 왜: 애플 심사(2026-10-22, iPhone 17 Pro Max · iOS 27.0.1, 1.3.18 빌드 2001)가 "We were unable sign in" 으로 반려했다.
#     심사 캡처 = 아이디 ctcrew·비밀번호 8자 입력 뒤 로그인 단추가 '처리 중...' 인 화면. 서버에서는 같은 계정이 정상 로그인된다.
#     심사 기기에 가까운 iOS 27 시뮬레이터에서 '지우고 새로 설치 → 실행 → 로그인' 을 여러 번 되풀이해 멈춤이 나는지 잰다.
# 하는 일: (작업 build) 이 저장소의 dist(이미 빌드된 앱 번들)로 시뮬레이터용 앱을 서명·비밀값 없이 빌드(기본 Release — 앱스토어와
#         같은 설정, 이 시험 빌드만 Capacitor 로그를 Release 에서도 켠다)해 넘긴다 — xcode=26 이면 macos-26 의 Xcode 26 으로
#         (앱스토어 출시 빌드 ios-release.yml 과 같은 Xcode) →
#         (작업 login) 받은 앱에 공개 값·Firebase 설정을 넣고, 정한 iOS 런타임으로 새 시뮬레이터를 만든다 →
#         회차마다 지우고 설치·실행 → 앱 안 링크 connecttrip://app-return/signup?mode=login 으로 로그인 화면 →
#         글자 인식(OCR) 위치로 아이디·비밀번호 칸을 눌러 입력 → 키보드를 내리고 '로그인' 단추(없으면 엔터) →
#         약 1~60초 동안 화면 상태(처리 중·오류·홈)를 실제 경과 초와 함께 기록한다.
# 두 가지 모드:
#   - 확인 모드(기본, 비밀값 없음): 없는 아이디 ctsimprobe + 틀린 비밀번호. 서버가 바로 '올바르지 않습니다'(400)를 돌려주므로
#     정상 앱은 몇 초 안에 ERROR_INVALID 가 된다. '처리 중'에 머물면 로그인 요청(fetch)부터 멈추는 것이다.
#   - 실제 로그인 모드: 환경 비밀값 DEMO_LOGIN_ID·DEMO_LOGIN_PW 가 있으면 그 계정으로 로그인한다(응답을 받은 뒤의 멈춤까지 본다).
#     화면이 홈으로 바뀌어도 '로그인 성공'의 증거는 아니다(홈은 비로그인에게도 보인다) — 서버 세션 기록으로 따로 확인한다.
# 해석 주의: 시뮬레이터는 실기기·심사 네트워크(IPv6 전용 NAT64)·APNs 와 다르다. 여기서 재현이 안 돼도 문제가 없다는 증거는 아니다.
#
# 공개 저장소 위생(ios-release.yml 과 같은 원칙): 실행 로그는 누구나 본다.
#   - 화면 글자는 로그에 찍지 않는다(회원 글·닉네임이 보일 수 있다). 판정 이름(PROCESSING 등)·경과 초만 찍는다.
#   - 캡처·글자 인식 결과·앱 콘솔·시스템 로그는 암호화한 파일로만 artifact 에 올린다(3일 보관). 평문 캡처는 올리지 않는다.
#     방식: 실행마다 새 AES-256 키(openssl rand)로 묶음을 암호화하고, 그 키를 아래 RSA-4096 공개 키(OAEP SHA-256)로 감싼다.
#     개인 키는 비공개 저장소 작업 폴더의 git 무시 파일(.env.diag.key.pem)에만 있다 — 저장소 비밀값이 필요 없다.
#     풀기: openssl pkeyutl -decrypt -inkey .env.diag.key.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
#             -in diag.key.enc -out k.txt && openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass file:k.txt \
#             -in diag.tar.gz.enc | tar xz
#   - 비밀번호는 axe 인자로만 쓰고 출력하지 않는다(set -x 금지).
#   - 트리거는 workflow_dispatch 하나뿐이다(포크 PR 이 비밀값에 닿을 길이 없다). 액션은 SHA 로 고정한다(저장소 설정이 강제).
#     탭 도구 AXe 도 릴리스 파일 하나를 SHA-256 으로 고정해 받는다(움직이는 brew tap 을 쓰지 않는다 — codex 지적).
#
# 실행(손으로만): gh workflow run ios-sim-login.yml -R Kkumakkuma/connectrip-ios [-f runner=xcode-27|macos-26]
#                 [-f runtime=iOS-27-0] [-f iterations=5] [-f startup_wait=15] [-f device='iPhone 17 Pro Max'] [-f configuration=Release]
#                 [-f mode=auto|probe|real] [-f launch_only=true] [-f extra_checks=true|false] [-f xcode=26]
#   macos-26 으로 비교할 때는 -f runtime=iOS-26-5 처럼 그 러너에 있는 런타임을 준다(없으면 있는 목록을 찍고 멈춘다).
#   심사 기기 재현(출시 빌드와 같은 Xcode 26 으로 빌드 → iOS 27 에서 실행): -f runner=xcode-27 -f runtime=iOS-27-0 -f xcode=26
#   판정: 실행만 = 모두 첫 화면 / 확인 모드 = 모두 15초 안에 '올바르지 않습니다' / 실제 로그인 = 모두 홈 / 추가 점검 = 모두 OK —
#         하나라도 아니면 작업이 실패로 끝난다(요약에 실패 항목).
# 비밀값 = 환경 "ios-release": FIREBASE_IOS_PLIST_B64 · VITE_*(7개, ios-release.yml 과 같음), 선택 DEMO_LOGIN_ID · DEMO_LOGIN_PW
# 이 파일의 원본은 비공개 저장소 ios-public/ 에 있다 — 여기서 고치지 말고 그쪽을 고쳐 다시 올린다.
name: iOS 시뮬레이터 로그인 시험
on:
  workflow_dispatch:
    inputs:
      runner:
        description: '러너(xcode-27 = Xcode 27·iOS 27 시뮬레이터 미리보기 이미지, macos-26 = iOS 26 비교용)'
        type: choice
        options: [xcode-27, macos-26]
        default: xcode-27
      runtime:
        description: 'iOS 런타임(예 iOS-27-0 — 심사 기기 27.0.1 에 가장 가까운 것). 러너에 없으면 멈춘다'
        type: string
        default: 'iOS-27-0'
      device:
        description: '기기 종류 이름(@3x 아이폰만 — 좌표를 캡처 픽셀 ÷ 3 으로 바꾼다)'
        type: string
        default: 'iPhone 17 Pro Max'
      iterations:
        description: '지우고 새로 설치 → 실행(→ 로그인) 되풀이 횟수(1~40)'
        type: string
        default: '5'
      mode:
        description: 'auto = 비밀값이 있으면 실제 로그인·없으면 확인 / probe = 확인 모드 강제(없는 아이디·틀린 비밀번호) / real = 실제 로그인(비밀값 필수)'
        type: choice
        options: [auto, probe, real]
        default: auto
      launch_only:
        description: '실행만 되풀이(로그인 안 함) — 새로 설치한 앱이 뜨는지만 많이 재 볼 때(Capacitor #8664 확인용)'
        type: boolean
        default: false
      extra_checks:
        description: '되풀이 뒤 한 번씩: 앱이 꺼진 상태에서 링크로 켜기(콜드 스타트 복귀) · PASS 본인확인 창 열고 닫기'
        type: boolean
        default: true
      startup_wait:
        description: '실행 뒤 로그인 화면으로 가기 전 기다릴 초(0~60). 시작 직후 경쟁 조건을 보려면 0'
        type: string
        default: '15'
      configuration:
        description: 'Release(앱스토어와 같음) / Debug'
        type: choice
        options: [Release, Debug]
        default: Release
      xcode:
        description: '빌드에 쓸 Xcode 주 버전(비우면 러너 기본). 26 = 앱스토어 출시 빌드(ios-release.yml)와 같은 Xcode 26 으로 빌드해 이 러너의 iOS 27 시뮬레이터에서 돌린다'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # 러너·실행만·빌드 Xcode 가 다른 시험은 서로 다른 기계라 같이 돌려도 된다
  group: ios-sim-login-${{ inputs.runner }}-${{ inputs.launch_only }}-${{ inputs.xcode }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  # 1) 시뮬레이터용 앱 빌드 — 비밀값 없이(공개 값 자리표시자 그대로·Firebase 설정 없이) 빌드해 artifact 로 넘긴다.
  #    xcode=26 이면 Xcode 26 이 있는 macos-26 에서 빌드한다(xcode-27 이미지에는 Xcode 27.x 만 있다 — 공식 이미지 목록, codex 지적).
  #    공개 저장소 artifact 는 누구나 받을 수 있다 — 그래서 비밀값이 없는 앱만 올리고, 비밀값은 시험 작업(2)이 받은 앱에 넣는다.
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.xcode == '26' && 'macos-26' || inputs.runner }}
    timeout-minutes: 60
    outputs:
      build_xcode: ${{ steps.xc.outputs.build_xcode }}
    env:
      DD: ${{ github.workspace }}/dd
      CONF: ${{ inputs.configuration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 번들·Xcode 기록
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html 이 없다"; exit 1; }
          python3 -c 'import json; d = json.load(open("release.json")); print("번들:", d["version"], "versionCode", d.get("versionCode"), "원본", d.get("source"))'
          sw_vers
          xcodebuild -version | paste -sd ' ' -
          ls -d /Applications/Xcode*.app | xargs -n1 basename | paste -sd ' ' -
          # 공개 값 자리표시자가 그대로여야 한다(비밀값이 든 번들을 artifact 로 올리지 않기 위해)
          grep -rqs "__CTPUB_" dist || { echo "::error::dist 에 공개 값 자리표시자가 없다"; exit 1; }

      - name: 빌드용 Xcode 고르기
        id: xc
        env:
          WANT_XC: ${{ inputs.xcode }}
        run: |
          case "$WANT_XC" in
            '') V=$(xcodebuild -version | paste -sd ' ' -); echo "빌드 Xcode: 러너 기본 — $V"; echo "build_xcode=$V" >> "$GITHUB_OUTPUT"; exit 0 ;;
            [0-9]|[0-9][0-9]) ;;
            *) echo "::error::xcode 는 비우거나 주 버전 숫자(예 26)"; exit 1 ;;
          esac
          XC=$(ls -d /Applications/Xcode_"$WANT_XC".*.app /Applications/Xcode_"$WANT_XC".app 2> /dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then echo "::error::이 러너에 Xcode $WANT_XC 이 없다 — $(ls -d /Applications/Xcode*.app | xargs -n1 basename | paste -sd ' ' -)"; exit 1; fi
          V=$(DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -version | paste -sd ' ' -)
          echo "빌드 Xcode: $XC — $V"
          echo "XCODE_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          echo "build_xcode=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치(Capacitor CLI·플러그인 네이티브 소스)
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/cap || { echo "::error::Capacitor CLI 가 설치되지 않았다"; exit 1; }

      - name: 이 시험 빌드만 Release 에서도 앱 로그 켜기
        run: |
          # Capacitor 기본값(debug)은 Release 빌드에서 JS 콘솔·플러그인 호출 로그를 끈다 — 멈춘 지점을 보려고 이 시험 빌드에서만 켠다
          python3 - <<'PY'
          import json
          p = "capacitor.config.json"
          c = json.load(open(p, encoding="utf-8"))
          c["loggingBehavior"] = "production"
          with open(p, "w", encoding="utf-8") as f:
              json.dump(c, f, ensure_ascii=False, indent=2)
          print("loggingBehavior =", c["loggingBehavior"])
          PY

      - name: Capacitor iOS 동기화
        run: |
          npx cap sync ios
          test -f ios/App/App/public/index.html
          # 이 작업은 비밀값 없이 빌드한다 — Firebase 설정 파일이 있으면 안 된다(공개 artifact 로 나간다)
          test ! -e ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/Info.plist

      - name: Swift 패키지 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spm
          key: ios-spm-${{ hashFiles('ios/App/App.xcodeproj/project.pbxproj', 'ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}

      - name: Swift 패키지 받기
        timeout-minutes: 15
        run: |
          if [ -n "${XCODE_DIR:-}" ]; then export DEVELOPER_DIR="$XCODE_DIR"; fi
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" > "$RUNNER_TEMP/resolve.log" 2>&1 || { tail -40 "$RUNNER_TEMP/resolve.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/resolve.log"

      - name: 시뮬레이터용 빌드(서명 없음·비밀값 없음)
        timeout-minutes: 30
        run: |
          if [ -n "${XCODE_DIR:-}" ]; then export DEVELOPER_DIR="$XCODE_DIR"; fi
          set +e
          # Release 는 프로젝트에 수동 서명·프로필 이름이 있다 — 서명을 끄고 프로필 지정도 비운다(빈 값이라 SPM 리소스 타깃에도 해가 없다).
          # 시뮬레이터 일반 대상으로 빌드한다(시험은 다른 러너·런타임에서 할 수 있다).
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration "$CONF" \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DD" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER="" PROVISIONING_PROFILE="" \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            grep -n "error:" "$RUNNER_TEMP/xcodebuild.log" | head -40 || true
            tail -40 "$RUNNER_TEMP/xcodebuild.log" || true
            exit $rc
          fi
          tail -2 "$RUNNER_TEMP/xcodebuild.log"
          APP="$DD/Build/Products/${CONF}-iphonesimulator/App.app"
          test -d "$APP"
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleShortVersionString|CFBundleVersion|"DTXcode"|DTSDKName' || true
          # 올리기 전 확인 — Firebase 설정 파일이 없고 공개 값이 자리표시자 그대로여야 한다
          if [ -e "$APP/GoogleService-Info.plist" ]; then echo "::error::앱에 GoogleService-Info.plist 가 들어 있다"; exit 1; fi
          grep -rqs "__CTPUB_" "$APP/public" || { echo "::error::앱 번들에 공개 값 자리표시자가 없다"; exit 1; }
          tar czf "$RUNNER_TEMP/sim-app.tgz" -C "$(dirname "$APP")" App.app
          ls -l "$RUNNER_TEMP/sim-app.tgz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-sim-app-${{ github.run_id }}
          path: ${{ runner.temp }}/sim-app.tgz
          retention-days: 1
          if-no-files-found: error

  # 2) 시험 — 받은 앱에 비밀값(공개 값·Firebase 설정)을 넣고, 정한 런타임의 새 시뮬레이터에서 되풀이한다
  login:
    needs: build
    runs-on: ${{ inputs.runner }}
    environment: ios-release
    timeout-minutes: 180
    env:
      APP_ID: com.connecttrip.app
      OUT: ${{ github.workspace }}/diag
      CONF: ${{ inputs.configuration }}
      BUILD_XCODE: ${{ needs.build.outputs.build_xcode }}
      AXE_VERSION: v1.8.0
      AXE_SHA256: 7b76340b72e90d0f211bc7c4636f15009076eff07acef2f2b632b175debd8834
    steps:
      - name: 러너 기록
        run: |
          sw_vers
          xcodebuild -version | paste -sd ' ' -
          echo "앱 빌드 Xcode: $BUILD_XCODE"
          mkdir -p "$OUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-sim-app-${{ github.run_id }}
          path: ${{ runner.temp }}/simapp

      - name: 시험용 앱 풀기
        run: |
          tar xzf "$RUNNER_TEMP/simapp/sim-app.tgz" -C "$RUNNER_TEMP/simapp"
          rm -f "$RUNNER_TEMP/simapp/sim-app.tgz"
          APP="$RUNNER_TEMP/simapp/App.app"
          test -f "$APP/public/index.html"
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleShortVersionString|CFBundleVersion|"DTXcode"|DTSDKName' || true
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Firebase iOS 설정
        env:
          FIREBASE_IOS_PLIST_B64: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}
        run: |
          # 번들은 푸시를 켠 채 빌드돼 있다 — 설정 파일이 없으면 앱이 시작 때 멈춘다(ios-release.yml 과 같음).
          # 빌드 단계 'Copy GoogleService-Info.plist (optional)' 이 하는 일(앱 묶음 맨 위에 복사)을 받은 앱에 직접 한다.
          PLIST="$APP/GoogleService-Info.plist"
          rm -f "$PLIST"
          if [ -z "$FIREBASE_IOS_PLIST_B64" ]; then echo "::error::FIREBASE_IOS_PLIST_B64 없음"; exit 1; fi
          printf '%s' "$FIREBASE_IOS_PLIST_B64" | base64 --decode > "$PLIST"
          plutil -lint "$PLIST" > /dev/null
          API_KEY=$(/usr/libexec/PlistBuddy -c 'Print :API_KEY' "$PLIST" 2>/dev/null || true)
          if [ -n "$API_KEY" ]; then echo "::add-mask::$API_KEY"; fi
          BID=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$PLIST")
          if [ "$BID" != "$APP_ID" ]; then echo "::error::GoogleService-Info.plist 의 BUNDLE_ID 가 $APP_ID 가 아니다"; rm -f "$PLIST"; exit 1; fi

      - name: 앱 공개 값 채우기(자리표시자 → 비밀값)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PORTONE_STORE_ID: ${{ secrets.VITE_PORTONE_STORE_ID }}
          VITE_PORTONE_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_CHANNEL_KEY }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          names = ["SUPABASE_URL", "SUPABASE_ANON_KEY", "PORTONE_STORE_ID", "PORTONE_CHANNEL_KEY",
                   "KAKAO_JS_KEY", "GOOGLE_MAPS_BROWSER_KEY", "GOOGLE_MAPS_MAP_ID"]
          vals = {n: os.environ.get("VITE_" + n, "").strip() for n in names}
          empty = [n for n, v in vals.items() if not v]
          if empty:
              sys.exit("비밀값 없음: " + ", ".join(empty))
          bad = [n for n, v in vals.items() if not re.fullmatch(r"[A-Za-z0-9_.:/=+-]+", v)]
          if bad:
              sys.exit("따옴표·역슬래시 같은 문자가 든 값은 넣지 않는다: " + ", ".join(bad))
          counts = dict.fromkeys(names, 0)
          root = pathlib.Path(os.environ["APP"]) / "public"
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix not in {".js", ".html", ".css", ".json", ".txt", ".webmanifest", ".xml", ".svg"}:
                  continue
              t = p.read_bytes().decode("utf-8")
              if "__CTPUB_" not in t:
                  continue
              for n in names:
                  ph = "__CTPUB_" + n + "__"
                  c = t.count(ph)
                  if c:
                      t = t.replace(ph, vals[n])
                      counts[n] += c
              p.write_bytes(t.encode("utf-8"))
          left = [str(p) for p in root.rglob("*") if p.is_file() and b"__CTPUB_" in p.read_bytes()]
          missing = [n for n, c in counts.items() if c == 0]
          print("채운 자리:", ", ".join(f"{n} {c}" for n, c in counts.items()))
          if missing or left:
              sys.exit(f"자리표시자 문제 — 못 찾음 {missing}, 남음 {left[:5]}")
          PY

      - name: 시험용 화면 상태 보고 넣기(이 시험 빌드에만)
        run: |
          # macOS 27 러너는 Vision 글자 인식이 안 되고(가상 머신에서 매번 CRImageReaderError — 10/27 실측) AXe 화면 요소에는 웹 화면 안의
          # 글자가 없다(스크롤 막대만 보임). 그래서 이 시험 빌드에만 작은 스크립트를 넣어 앱이 0.7초마다 지금 주소·화면 글자(공백 뺌)·
          # 입력칸/단추 가운데 위치(웹 좌표)를 앱 문서 폴더 ct-sim-state.json 에 남기게 하고, 시험 루프가 그 파일로 판정·터치한다.
          # 파일은 암호화 묶음에만 들어간다(화면 글자 평문을 공개 로그에 남기지 않는다). 앱스토어 빌드(ios-release.yml)에는 없다.
          cat > "$APP/public/ct-sim-probe.js" <<'JS'
          /* ct-sim-probe — ios-sim-login.yml 시험 빌드에만 들어간다 */
          (function () {
            var busy = false;
            function norm(s) { return String(s || '').replace(/\s+/g, ''); }
            function center(el) {
              if (!el) return null;
              var r = el.getBoundingClientRect();
              if (!(r.width > 0 && r.height > 0)) return null;
              return [Math.round(r.left + r.width / 2), Math.round(r.top + r.height / 2)];
            }
            function first(sel, text) {
              var els = document.querySelectorAll(sel);
              for (var i = 0; i < els.length; i++) {
                if (!text || norm(els[i].innerText).indexOf(text) >= 0) return els[i];
              }
              return null;
            }
            // 글자가 정확히 같은 가장 작은 요소(제목처럼 눌러도 아무 일 없는 곳 — 키보드 내리기용)
            function exact(text) {
              var best = null, area = Infinity, els = document.body.getElementsByTagName('*');
              for (var i = 0; i < els.length; i++) {
                if (norm(els[i].innerText) !== text) continue;
                var r = els[i].getBoundingClientRect(), a = r.width * r.height;
                if (a > 0 && a < area) { best = els[i]; area = a; }
              }
              return best;
            }
            function writer() {
              var cap = window.Capacitor;
              if (!cap) return null;
              if (cap.Plugins && cap.Plugins.Filesystem) return function (o) { return cap.Plugins.Filesystem.writeFile(o); };
              if (typeof cap.nativePromise === 'function') return function (o) { return cap.nativePromise('Filesystem', 'writeFile', o); };
              return null;
            }
            function snap() {
              var write = writer();
              if (busy || !write || !document.body) return;
              busy = true;
              var login = /^\/signup/.test(location.pathname);
              var s = {
                at: Date.now(),
                path: location.pathname + location.search,
                text: norm(document.body.innerText).slice(0, 6000),
                id: center(first("input[autocomplete='username']")),
                pw: center(first("input[type='password']")),
                login: center(first("button[type='submit']", '로그인')),
                title: login ? center(exact('계정에로그인하세요')) : null,
                pass: center(first('button', 'PASS로본인확인')),
                iw: window.innerWidth, ih: window.innerHeight
              };
              try {
                write({ path: 'ct-sim-state.json', directory: 'DOCUMENTS', data: JSON.stringify(s), encoding: 'utf8' })
                  .then(function () { busy = false; }, function () { busy = false; });
              } catch (e) { busy = false; }
            }
            setInterval(snap, 700);
          })();
          JS
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ["APP"]) / "public" / "index.html"
          html = p.read_text(encoding="utf-8")
          if "</body>" not in html:
              raise SystemExit("index.html 에 </body> 가 없다")
          p.write_text(html.replace("</body>", '<script src="/ct-sim-probe.js"></script>\n</body>', 1), encoding="utf-8")
          print("상태 보고 스크립트 넣음")
          PY

      - name: 시뮬레이터 만들기(정한 런타임 + 기기 종류)
        id: sim
        env:
          WANT_RT: ${{ inputs.runtime }}
          WANT_DEV: ${{ inputs.device }}
        run: |
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"
          # 정확히 그 런타임이 없으면 다른 버전으로 몰래 바꾸지 않고 멈춘다(27.0 결과를 27.0.1 재현이라 부르지 않기 위해 요약에 버전·빌드를 남긴다)
          PICK=$(python3 - "$RUNNER_TEMP/runtimes.json" <<'PY'
          import json, os, sys
          want_rt, want_dev = os.environ["WANT_RT"].strip(), os.environ["WANT_DEV"].strip()
          rts = [r for r in json.load(open(sys.argv[1]))["runtimes"] if r.get("isAvailable") and ".iOS-" in r.get("identifier", "")]
          rt = next((r for r in rts if r["identifier"].endswith("." + want_rt)), None)
          if rt is None:
              sys.exit("UNSUPPORTED_RUNTIME " + want_rt + " — 이 러너의 iOS 런타임: " + ", ".join(r["identifier"].split(".")[-1] + "(" + r.get("buildversion", "") + ")" for r in rts))
          dt = next((d for d in rt.get("supportedDeviceTypes", []) if d.get("name") == want_dev), None)
          if dt is None:
              sys.exit("기기 종류 없음: " + want_dev)
          print(rt["identifier"], dt["identifier"], rt.get("version", ""), rt.get("buildversion", ""))
          PY
          )
          read -r RID DTID RVER RBUILD <<< "$PICK"
          UDID=$(xcrun simctl create "ct-login-$GITHUB_RUN_ID" "$DTID" "$RID")
          echo "시뮬레이터: $WANT_DEV · iOS $RVER ($RBUILD) · $UDID"
          {
            echo "udid=$UDID"
            echo "rt=iOS $RVER ($RBUILD)"
          } >> "$GITHUB_OUTPUT"

      - name: 탭 도구(AXe, 고정 릴리스)·글자 인식 도구
        timeout-minutes: 8
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/axe.tar.gz" \
            "https://github.com/cameroncooke/AXe/releases/download/$AXE_VERSION/AXe-macOS-$AXE_VERSION-universal.tar.gz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/axe"
          tar xzf "$RUNNER_TEMP/axe.tar.gz" -C "$RUNNER_TEMP/axe"
          rm -f "$RUNNER_TEMP/axe.tar.gz"
          "$RUNNER_TEMP/axe/axe" --version
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"
          # 글자 인식: Vision(기본) → Vision(CPU 만) 순서로 해 보고 둘 다 안 되면 3 으로 끝낸다(부르는 쪽이 AXe 화면 요소로 대신 읽는다).
          # macOS 27 러너에서는 Vision 이 매번 CRImageReaderError.unknownError 로 죽었다(10/27 실측 — 화면은 정상인데 '빈 화면'으로 판정).
          cat > "$RUNNER_TEMP/ocrbox.swift" <<'SWIFT'
          import AppKit
          import CoreML
          import Foundation
          import Vision
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          guard let image = NSImage(contentsOf: url),
                let cg = image.cgImage(forProposedRect: nil, context: nil, hints: nil) else { exit(2) }
          func note(_ s: String) { FileHandle.standardError.write((s + "\n").data(using: .utf8)!) }
          func recognize(cpuOnly: Bool) throws -> [VNRecognizedTextObservation] {
              let request = VNRecognizeTextRequest()
              request.recognitionLevel = .accurate
              request.recognitionLanguages = ["ko-KR", "en-US"]
              request.usesLanguageCorrection = false
              if cpuOnly {
                  for (stage, devices) in try request.supportedComputeStageDevices {
                      if let cpu = devices.first(where: { if case .cpu(_) = $0 { return true }; return false }) {
                          request.setComputeDevice(cpu, for: stage)
                      }
                  }
              }
              try VNImageRequestHandler(cgImage: cg).perform([request])
              return request.results ?? []
          }
          for (name, cpuOnly) in [("vision", false), ("vision-cpu", true)] {
              do {
                  let observations = try recognize(cpuOnly: cpuOnly)
                  for observation in observations {
                      guard let text = observation.topCandidates(1).first?.string else { continue }
                      let b = observation.boundingBox
                      print(String(format: "%.4f\t%.4f\t", b.midX, 1 - b.midY) + text)
                  }
                  note("ocr-method \(name)")
                  exit(0)
              } catch {
                  note("ocr \(name) 실패: \(error)")
              }
          }
          exit(3)
          SWIFT
          swiftc -O "$RUNNER_TEMP/ocrbox.swift" -o "$RUNNER_TEMP/ocrbox"
          # 두 캡처의 화면 변화량(0~1) — 작게 줄인 회색조에서 밝기 차가 큰 점의 비율. PASS 창이 떴는지의 보조 증거
          # (iOS 27 창은 'Cancel' 글자 대신 X 아이콘이고, macOS 27 러너는 글자 인식이 안 돼 창 안 주소도 못 읽는다 — 10/27 실측).
          cat > "$RUNNER_TEMP/imgdiff.swift" <<'SWIFT'
          import AppKit
          let w = 110, h = 239
          func gray(_ path: String) -> [UInt8]? {
              guard let image = NSImage(contentsOfFile: path),
                    let cg = image.cgImage(forProposedRect: nil, context: nil, hints: nil) else { return nil }
              var buf = [UInt8](repeating: 0, count: w * h)
              let ok = buf.withUnsafeMutableBytes { raw -> Bool in
                  guard let ctx = CGContext(data: raw.baseAddress, width: w, height: h, bitsPerComponent: 8, bytesPerRow: w,
                                            space: CGColorSpaceCreateDeviceGray(), bitmapInfo: CGImageAlphaInfo.none.rawValue) else { return false }
                  ctx.interpolationQuality = .medium
                  ctx.draw(cg, in: CGRect(x: 0, y: 0, width: w, height: h))
                  return true
              }
              return ok ? buf : nil
          }
          guard CommandLine.arguments.count == 3, let a = gray(CommandLine.arguments[1]), let b = gray(CommandLine.arguments[2]) else { exit(2) }
          var changed = 0
          for i in 0..<(w * h) where abs(Int(a[i]) - Int(b[i])) > 24 { changed += 1 }
          print(String(format: "%.3f", Double(changed) / Double(w * h)))
          SWIFT
          swiftc -O "$RUNNER_TEMP/imgdiff.swift" -o "$RUNNER_TEMP/imgdiff"
          # 화면 판정 — classify.py ocr <글자 파일> | state <앱 상태 파일>. 판정 이름만 낸다(화면 글자는 안 낸다).
          cat > "$RUNNER_TEMP/classify.py" <<'PY'
          import json, re, sys, unicodedata
          def norm(s):
              return re.sub(r"\s+", "", unicodedata.normalize("NFKC", s or "")).casefold()
          mode, path = sys.argv[1], sys.argv[2]
          if mode == "state":
              s = json.load(open(path, encoding="utf-8"))
              t = norm(s.get("text"))
              lines = [t]
              has_button = bool(s.get("login"))
          else:
              lines = []
              for l in open(path, encoding="utf-8"):
                  parts = l.rstrip("\n").split("\t", 2)
                  if len(parts) == 3:
                      lines.append(norm(parts[2]))
              t = "".join(lines)
              has_button = "로그인" in lines
          tags = []
          login_marks = ("계정에로그인하세요", "비밀번호를잊으셨나요", "아이디찾기", "계정이없으신가요")
          home_marks = ("동행", "여행정보", "플래너", "추천지", "물품거래")
          if any(x.startswith("처리중") for x in lines) or "처리중..." in t:
              tags.append("PROCESSING")
          if any(m in t for m in login_marks):
              if "아이디또는비밀번호가올바르지않습니다" in t:
                  tags.append("ERROR_INVALID")
              elif "아이디와비밀번호를입력해주세요" in t:
                  tags.append("ERROR_REQUIRED")
              elif "아이디형식이올바르지않습니다" in t:
                  tags.append("ERROR_ID_FORMAT")
              else:
                  for k in ("loadfailed", "failedtofetch", "networkrequestfailed", "networkerror", "timedout", "timeout", "ratelimit", "failed", "error", "오류", "실패"):
                      if k in t:
                          tags.append("ERROR_OTHER:" + k)
                          break
              if not tags:
                  tags.append("FORM_IDLE" if has_button else "FORM_NO_BUTTON")
          elif not tags:
              tags.append("HOME" if any(m in t for m in home_marks) else "UNKNOWN")
          if "notifications" in t or ("알림" in t and "보내" in t):
              tags.append("PUSH_ALERT")
          if len(t) < 8:
              tags.append("BLANK")
          print(" ".join(tags))
          PY
          # 앱 상태 파일 확인 — 0 = 4초 안에 쓴 것, 1 = 오래됨(앱이 못 쓰고 있음), 2 = 깨짐(쓰는 도중에 읽음 → 다시 읽는다)
          cat > "$RUNNER_TEMP/state_fresh.py" <<'PY'
          import json, sys, time
          try:
              s = json.load(open(sys.argv[1], encoding="utf-8"))
              at = float(s.get("at") or 0)
          except Exception:
              sys.exit(2)
          sys.exit(0 if abs(time.time() * 1000 - at) <= 4000 else 1)
          PY
          # AXe 화면 요소(손쉬운 사용 정보) → OCR 과 같은 꼴(가로 중심 비율 \t 세로 중심 비율(위가 0) \t 글자)
          cat > "$RUNNER_TEMP/ax2tsv.py" <<'PY'
          import json, re, sys
          path, W, H = sys.argv[1], float(sys.argv[2] or 0), float(sys.argv[3] or 0)
          raw = open(path, encoding="utf-8", errors="replace").read()
          starts = [k for k in (raw.find("["), raw.find("{")) if k >= 0]
          if not starts:
              sys.exit("AXe 출력에 JSON 이 없다")   # 빈 화면이 아니라 인식 실패로 끝낸다(codex 지적)
          data = json.loads(raw[min(starts):])
          out = []
          def frame(n):
              f = n.get("frame")
              if isinstance(f, dict) and all(k in f for k in ("x", "y", "width", "height")):
                  return float(f["x"]), float(f["y"]), float(f["width"]), float(f["height"])
              s = n.get("AXFrame")
              if isinstance(s, str):
                  m = re.findall(r"-?\d+(?:\.\d+)?", s)
                  if len(m) >= 4:
                      return tuple(float(v) for v in m[:4])
              return None
          def walk(n):
              if isinstance(n, list):
                  for c in n:
                      walk(c)
                  return
              if not isinstance(n, dict):
                  return
              texts = []
              for k in ("AXLabel", "AXValue", "title", "AXPlaceholderValue", "label", "value"):
                  v = n.get(k)
                  if isinstance(v, str) and v.strip() and v.strip() not in texts:
                      texts.append(v.strip())
              fr = frame(n)
              # 화면 절반 넘게 덮는 묶음 요소(글자를 다 모아 가진 경우가 있다)는 위치가 엉뚱해 빼고 자식만 본다
              if texts and fr and W and H and fr[2] * fr[3] <= 0.5 * W * H:
                  cx, cy = (fr[0] + fr[2] / 2) / W, (fr[1] + fr[3] / 2) / H
                  if 0 <= cx <= 1 and 0 <= cy <= 1:
                      out.append(f"{cx:.4f}\t{cy:.4f}\t" + " ".join(texts).replace("\n", " ").replace("\t", " "))
              for k, v in n.items():
                  if isinstance(v, (list, dict)):
                      walk(v)
          walk(data)
          # 읽은 글자가 없으면 아무것도 쓰지 않는다(빈 줄 1바이트도 '읽었다'로 보이지 않게 — codex 지적)
          if out:
              print("\n".join(out))
          PY

      - name: 지우고 새로 설치 → 실행 → 로그인 되풀이
        timeout-minutes: 150
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          RT: ${{ steps.sim.outputs.rt }}
          N: ${{ inputs.iterations }}
          SW: ${{ inputs.startup_wait }}
          DEV: ${{ inputs.device }}
          MODE_IN: ${{ inputs.mode }}
          LAUNCH_ONLY: ${{ inputs.launch_only }}
          EXTRA: ${{ inputs.extra_checks }}
          LOGIN_ID: ${{ secrets.DEMO_LOGIN_ID }}
          LOGIN_PW: ${{ secrets.DEMO_LOGIN_PW }}
        run: |
          set -uo pipefail
          case "$N" in [1-9]|[1-3][0-9]|40) ;; *) echo "::error::iterations 는 1~40"; exit 1 ;; esac
          case "$SW" in [0-9]|[1-5][0-9]|60) ;; *) echo "::error::startup_wait 는 0~60"; exit 1 ;; esac
          # 모드: auto = 비밀값이 있으면 실제 로그인 / probe = 확인 모드 강제 / real = 비밀값 필수(codex 지적 — 비밀값이 생겨도 확인 모드를 고를 수 있게)
          if [ "$MODE_IN" = probe ] || { [ "$MODE_IN" = auto ] && { [ -z "$LOGIN_ID" ] || [ -z "$LOGIN_PW" ]; }; }; then
            # 확인 모드: 없는 아이디 + 틀린 비밀번호 — 공개해도 되는 값이다. 정상이면 몇 초 안에 ERROR_INVALID.
            LOGIN_ID="ctsimprobe"; LOGIN_PW="probe-wrong-1"; KIND=probe; MODE="확인(없는 아이디·틀린 비밀번호 → 오류 문구가 떠야 정상)"
          elif [ -n "$LOGIN_ID" ] && [ -n "$LOGIN_PW" ]; then
            KIND=real; MODE="실제 로그인(비밀값 계정)"
          else
            echo "::error::mode=real 인데 DEMO_LOGIN_ID·DEMO_LOGIN_PW 비밀값이 없다"; exit 1
          fi
          [ "$LAUNCH_ONLY" = true ] && MODE="$MODE · 실행만(로그인 안 함)"
          echo "모드: $MODE"
          OCR="$RUNNER_TEMP/ocrbox"
          codesign --verify "$APP" 2>/dev/null || codesign --force --deep --sign - "$APP"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          # AXe 예열 — 첫 원격 자동화 세션을 미리 열어 둔다(첫 회차 첫 터치들이 무시되거나 시간 초과가 났다 — 10/27 iOS 26.5)
          axe describe-ui --udid "$UDID" > /dev/null 2>> "$OUT/axe-err.txt" || true
          CONPID=""; LOGPID=""
          # 회차의 콘솔·시스템 로그 수집을 끝낸다(중간에 멈춰도 EXIT 에서 정리 — 암호화 묶음이 깨지지 않게)
          stop_logs() {
            local p
            for p in $CONPID $LOGPID; do kill "$p" 2> /dev/null || true; wait "$p" 2> /dev/null || true; done
            CONPID=""; LOGPID=""
          }
          trap stop_logs EXIT
          # 떠 있는 앱만 센다. simctl launch 가 콘솔 첫 줄에 찍는 호스트 PID 로 본다(iOS 27 은 launchctl 이름 꼴이 달라 예전 방식이
          # 떠 있는 앱도 못 찾았다 — 1회차 실측). PID 를 아직 못 읽었으면 예전 launchctl 방식으로 본다.
          app_pid() { sed -n "s/^$APP_ID: \([0-9][0-9]*\).*/\1/p" "$OUT/$P-console.txt" 2>/dev/null | head -1; }
          alive() {
            local pid
            pid=$(app_pid)
            if [ -n "$pid" ]; then kill -0 "$pid" 2> /dev/null; return; fi
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null \
              | awk -v id="UIKitApplication:$APP_ID" '$1 ~ /^[0-9]+$/ && index($3, id "[") == 1 { f = 1 } END { exit f ? 0 : 1 }'
          }
          # 첫 화면이 안 뜨면 원인 표지를 남긴다: 시스템 로그의 UIScene 수명 주기 요구(iOS 27 SDK 로 빌드한 앱 — 1회차 실측)와
          # 앱 스레드 표본(호스트 sample, 암호화 묶음에만)
          launch_diag() {
            local pid tag=""
            if grep -q "UIScene life cycle is required" "$OUT/$P-syslog.txt" 2> /dev/null; then tag="UISCENE_REQUIRED"; fi
            pid=$(app_pid)
            if [ -n "$pid" ] && kill -0 "$pid" 2> /dev/null; then sample "$pid" 3 -file "$OUT/$P-sample.txt" > /dev/null 2>&1 || true; fi
            # 가장 최근에 뜬 WebContent(이 회차 웹 화면) 표본 — #8664 는 WebContent 가 앱의 동기 응답을 기다리며 멈춘다(codex 지적)
            local wpid
            wpid=$(pgrep -n -f "com.apple.WebKit.WebContent" 2> /dev/null || true)
            if [ -n "$wpid" ]; then sample "$wpid" 3 -file "$OUT/$P-webcontent-sample.txt" > /dev/null 2>&1 || true; fi
            echo "$tag"
          }
          # 러너 기본 셸은 -e 다 — 도우미는 실패를 상태값으로 돌려주고, 부르는 쪽이 그 회차만 실패로 적는다
          shot() { xcrun simctl io "$UDID" screenshot "$OUT/$1.png" > /dev/null 2>&1; }
          # 캡처 글자 → "$OUT/$1-ocr.txt". Vision 이 이 러너에서 안 되면(ocrbox 3) 표시 파일을 남기고 그 뒤로는 AXe 화면 요소로 읽는다.
          ocr() {
            local rc=0 w=$PTW h=$PTH
            if [ ! -f "$OUT/.no-vision" ]; then
              "$OCR" "$OUT/$1.png" > "$OUT/$1-ocr.txt" 2>> "$OUT/ocr-err.txt" || rc=$?
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -eq 3 ]; then : > "$OUT/.no-vision"; fi
            fi
            if [ "$w" -eq 0 ] || [ "$h" -eq 0 ]; then
              w=$(sips -g pixelWidth "$OUT/$1.png" 2> /dev/null | awk '/pixelWidth/ { print int($2 / 3) }' || true)
              h=$(sips -g pixelHeight "$OUT/$1.png" 2> /dev/null | awk '/pixelHeight/ { print int($2 / 3) }' || true)
              w=${w:-0}; h=${h:-0}
            fi
            # 화면 요소도 못 읽으면(axe 실패·JSON 해석 실패) 1 — 부르는 쪽이 '빈 화면'이 아니라 인식 실패(OCR_FAIL)로 적는다(codex 지적)
            if axe describe-ui --udid "$UDID" > "$OUT/$1-ax.json" 2>> "$OUT/ocr-err.txt" \
              && python3 "$RUNNER_TEMP/ax2tsv.py" "$OUT/$1-ax.json" "$w" "$h" > "$OUT/$1-ocr.txt" 2>> "$OUT/py-err.txt"; then
              echo "ocr-method axe" >> "$OUT/ocr-err.txt"
              return 0
            fi
            : > "$OUT/$1-ocr.txt"
            echo "ocr-method axe-fail" >> "$OUT/ocr-err.txt"
            return 1
          }
          PTW=0; PTH=0
          # 화면 pt 크기 = 캡처 픽셀 ÷ 3(@3x 기기)
          dims() {
            local w h
            w=$(sips -g pixelWidth "$OUT/$1.png" 2> /dev/null | awk '/pixelWidth/ { print $2 }') || return 1
            h=$(sips -g pixelHeight "$OUT/$1.png" 2> /dev/null | awk '/pixelHeight/ { print $2 }') || return 1
            [ -n "$w" ] && [ -n "$h" ] || return 1
            PTW=$(( w / 3 )); PTH=$(( h / 3 ))
          }
          # find_text 캡처 글자 [top|bottom] [exact] → 그 글자 줄 가운데 "x y"(pt), 없으면 빈 줄. 화면 글자는 출력하지 않는다.
          find_text() {
            # 화면 크기를 아직 모르면(첫 회차 전) 이 캡처로 잰다 — 0 이면 위치를 못 내 늘 '없음'이 된다(codex 지적)
            if [ "$PTW" -eq 0 ] || [ "$PTH" -eq 0 ]; then dims "$1" || true; fi
            ocr "$1" || true
            python3 - "$OUT/$1-ocr.txt" "$2" "${3:-top}" "${4:-}" "$PTW" "$PTH" 2>> "$OUT/py-err.txt" <<'PY' || true
          import re, sys, unicodedata
          def norm(s):
              return re.sub(r"\s+", "", unicodedata.normalize("NFKC", s)).casefold()
          path, want, where, exact = sys.argv[1], norm(sys.argv[2]), sys.argv[3], sys.argv[4] == 'exact'
          W, H = int(sys.argv[5]), int(sys.argv[6])
          hits = []
          for line in open(path, encoding='utf-8'):
              parts = line.rstrip('\n').split('\t', 2)
              if len(parts) != 3:
                  continue
              t = norm(parts[2])
              if (t == want) if exact else (want in t):
                  hits.append((float(parts[1]), float(parts[0])))
          if hits and W and H:
              y, x = max(hits) if where == 'bottom' else min(hits)
              print(round(x * W), round(y * H))
          PY
          }
          # 좌표 터치 — AXe 가 가끔 실패한다(시뮬레이터 원격 자동화 세션 시간 초과 등 — 10/27 iOS 26.5 3회차 '아이디 칸 못 누름'은
          # 위치를 알았는데 터치가 실패했다) → 1초 간격 3번까지. AXe 오류는 진단 묶음에만.
          tap_at() {
            local k
            for k in 1 2 3; do
              if axe tap -x "${1% *}" -y "${1#* }" --udid "$UDID" > /dev/null 2>> "$OUT/axe-err.txt"; then return 0; fi
              sleep 1
            done
            return 1
          }
          # open_link 경로 캡처이름 — connecttrip://app-return<경로> 를 연다. iOS 는 밖에서 커스텀 스킴을 열면 'Open in 커넥트립?' 확인 창을
          # 띄운다(뜰 때도 안 뜰 때도 있다). 창이 있으면 [Open] 을 누르고 창이 정말 닫혔는지 다시 본다 — 창이 나타나는 중에 누르면 axe 는
          # 성공을 돌려주는데 창이 그대로 남거나(26.5), 첫 창은 세 번 눌러도 안 닫혔다(10/27 실측) → 간격을 늘려 다섯 번까지 누른다.
          # openurl 이 실패하거나 다섯 번 눌러도 창이 남으면 1 을 돌려준다(부르는 쪽이 그 점검을 실패로 적는다 — codex 지적).
          dialog_up() { [ -n "$(find_text "$1" "Open in" top)" ]; }
          open_link() {
            local pos k
            if ! xcrun simctl openurl "$UDID" "connecttrip://app-return$1" > /dev/null 2>&1; then echo "  (openurl 실패 $1)"; return 1; fi
            sleep 3
            for k in 1 2 3 4 5; do
              if ! shot "$2-confirm$k"; then sleep 1; continue; fi
              if ! dialog_up "$2-confirm$k"; then
                # 글자를 하나도 못 읽었으면 창이 있는지 모른다 — 그대로 넘기고 뒤의 화면 판정이 결과를 가린다(codex 지적)
                if [ ! -s "$OUT/$2-confirm$k-ocr.txt" ]; then echo "  (링크 확인 창 여부를 못 읽음 $1)"; fi
                if [ "$k" -gt 1 ]; then echo "  (링크 확인 창: ${k}번째에 닫힌 것 확인 $1)"; fi
                return 0
              fi
              sleep 1
              if ! axe tap --label "Open" --element-type Button --wait-timeout 3 --udid "$UDID" > /dev/null 2>> "$OUT/axe-err.txt"; then
                pos=$(find_text "$2-confirm$k" Open bottom exact)
                if [ -n "$pos" ]; then tap_at "$pos" || true; fi
              fi
              sleep $(( k < 3 ? 2 : 3 ))
            done
            shot "$2-confirm6" || true
            if dialog_up "$2-confirm6"; then echo "  (링크 확인 창이 다섯 번 눌러도 안 닫힘 $1)"; return 1; fi
            return 0
          }
          # 앱 상태 파일(시험 빌드의 ct-sim-probe.js) — 4초 안에 쓴 것만 믿는다(앱이 멈추면 새로 쓰지 못해 오래된 파일만 남는다).
          # 있으면 "$OUT/$1-state.json" 으로 복사(암호화 묶음에만)하고 0, 없거나 오래됐으면 1. 앱이 쓰는 도중에 읽어 깨진 파일이면
          # (10/27 iOS 27 — 오류 문구가 1초에 떴는데 이 때문에 41초로 잡혔다) 0.3초 뒤 다시 읽는다(네 번까지).
          app_state() {
            local c k rc
            c=$(xcrun simctl get_app_container "$UDID" "$APP_ID" data 2> /dev/null) || return 1
            for k in 1 2 3 4; do
              if [ -f "$c/Documents/ct-sim-state.json" ] && cp "$c/Documents/ct-sim-state.json" "$OUT/$1-state.json" 2> /dev/null; then
                rc=0
                python3 "$RUNNER_TEMP/state_fresh.py" "$OUT/$1-state.json" 2>> "$OUT/py-err.txt" || rc=$?
                case "$rc" in 0) return 0 ;; 1) return 1 ;; esac
              fi
              sleep 0.3
            done
            return 1
          }
          # 웹 화면의 화면 위 시작점(pt) — AXe 화면 요소의 웹 스크롤 영역(가로가 화면 너비) 왼쪽 위. 한 번 재서 표시 파일에 둔다.
          wv_origin() {
            if [ ! -s "$OUT/.wv" ]; then
              axe describe-ui --udid "$UDID" > "$OUT/wv-ax.json" 2>> "$OUT/ocr-err.txt" || return 1
              python3 - "$OUT/wv-ax.json" "$PTW" > "$OUT/.wv" 2>> "$OUT/py-err.txt" <<'PY' || { rm -f "$OUT/.wv"; return 1; }
          import json, sys
          raw = open(sys.argv[1], encoding="utf-8").read()
          starts = [k for k in (raw.find("["), raw.find("{")) if k >= 0]
          if not starts:
              sys.exit(1)
          W = float(sys.argv[2] or 0)
          best = []
          def walk(n):
              if isinstance(n, list):
                  for c in n:
                      walk(c)
                  return
              if not isinstance(n, dict):
                  return
              f = n.get("frame") or {}
              if n.get("type") == "ScrollArea" and f.get("width") and (not W or abs(float(f["width"]) - W) < 2):
                  best.append((float(f["y"]), float(f["x"])))
              for c in n.get("children") or []:
                  walk(c)
          walk(json.loads(raw[min(starts):]))
          if not best:
              sys.exit(1)
          y, x = min(best)
          print(round(x), round(y))
          PY
            fi
            cat "$OUT/.wv"
          }
          # web_pos 이름(id|pw|login|title|pass) → 그 웹 요소 가운데 화면 좌표 "x y"(pt), 모르면 빈 줄
          web_pos() {
            local o
            app_state "pos-$1" || return 0
            o=$(wv_origin) || return 0
            python3 - "$OUT/pos-$1-state.json" "$1" "$o" 2>> "$OUT/py-err.txt" <<'PY' || true
          import json, sys
          s = json.load(open(sys.argv[1], encoding="utf-8"))
          ox, oy = (float(v) for v in sys.argv[3].split())
          v = s.get(sys.argv[2])
          if isinstance(v, list) and len(v) == 2:
              print(round(ox + v[0]), round(oy + v[1]))
          PY
          }
          # 판정 이름만 낸다(화면 글자는 안 낸다). 증거가 있을 때만 붙인다 — 로그인 화면 표지가 없다고 '로그인 성공'으로 치지 않는다.
          #   로그인 화면(표지 하나 이상): PROCESSING / ERROR_INVALID / ERROR_REQUIRED / ERROR_ID_FORMAT / ERROR_OTHER:<말> /
          #                               FORM_IDLE('로그인' 단추 확인) / FORM_NO_BUTTON
          #   홈(홈 표지 있고 로그인 화면 표지 없음): HOME      그 밖: UNKNOWN      덧붙임: PUSH_ALERT · BLANK(글자가 거의 없음)
          # 앱 상태 파일이 있으면 그것으로(웹 화면 글자 그대로), 없으면 캡처 글자 인식으로.
          state() {
            if app_state "$1"; then
              echo "ocr-method state" >> "$OUT/ocr-err.txt"
              python3 "$RUNNER_TEMP/classify.py" state "$OUT/$1-state.json" 2>> "$OUT/py-err.txt"
              return
            fi
            ocr "$1" || return 1
            python3 "$RUNNER_TEMP/classify.py" ocr "$OUT/$1-ocr.txt" 2>> "$OUT/py-err.txt"
          }
          RESULTS=()
          for i in $(seq 1 "$N"); do
            P="r$i"
            stop_logs
            # 앞 회차에서 남은 링크 확인 창이 있으면 닫는다(남은 창이 다음 회차 링크를 늦게 넣어 결과가 꼬였다 — 10/27 실측)
            if shot "$P-00-pre" && dialog_up "$P-00-pre"; then
              axe tap --label "Cancel" --element-type Button --wait-timeout 3 --udid "$UDID" > /dev/null 2>&1 || true
              echo "  (${i}회차 전: 남은 링크 확인 창을 닫음)"
            fi
            xcrun simctl terminate "$UDID" "$APP_ID" > /dev/null 2>&1 || true
            xcrun simctl uninstall "$UDID" "$APP_ID" > /dev/null 2>&1 || true
            if xcrun simctl get_app_container "$UDID" "$APP_ID" > /dev/null 2>&1; then
              echo "${i}회차: 지운 뒤에도 앱이 남아 있다"; RESULTS+=("$i:RESET_FAIL"); continue
            fi
            if ! xcrun simctl install "$UDID" "$APP"; then echo "::error::${i}회차 설치 실패"; RESULTS+=("$i:INSTALL_FAIL"); continue; fi
            # 시스템 로그(앱·WebKit 프로세스) — 암호화 묶음에만 들어간다
            xcrun simctl spawn "$UDID" log stream --style compact --level info \
              --predicate 'process == "App" OR process BEGINSWITH "com.apple.WebKit"' > "$OUT/$P-syslog.txt" 2>&1 &
            LOGPID=$!
            T0=$(date +%s)
            xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$APP_ID" > "$OUT/$P-console.txt" 2>&1 &
            CONPID=$!
            up=""
            for k in $(seq 1 20); do
              if alive; then up=1; break; fi
              sleep 3
            done
            if [ -z "$up" ]; then tag=$(launch_diag); echo "${i}회차: 60초 안에 앱 프로세스가 안 떴다 $tag"; RESULTS+=("$i:LAUNCH_FAIL${tag:+,$tag}"); continue; fi
            sleep "$SW"
            if ! shot "$P-01-home" || ! dims "$P-01-home"; then echo "${i}회차: 첫 화면 캡처 실패"; RESULTS+=("$i:CAPTURE_FAIL"); continue; fi
            st=$(state "$P-01-home") || st="OCR_FAIL"
            # 첫 화면이 아직이면 3초마다 30초까지 더 본다 — 느린 첫 실행은 곧 뜨고(10/27 Xcode 27 빌드 30번 중 2번 36·40초에
            # 아직 그리기 전 → 뒤에 정상), 멈춤(#8664)은 시간이 지나도 안 풀린다. 더 본 만큼은 '+N초'로 남긴다.
            # 캡처·판독에 드는 시간까지 실제 경과로 잰다(codex 지적)
            w0=$(date +%s); waited=0; wk=0
            while [[ "$st" != *HOME* ]] && [ "$waited" -lt 30 ]; do
              sleep 3; wk=$(( wk + 1 ))
              shot "$P-01-home-w$wk" || true
              st=$(state "$P-01-home-w$wk") || st="OCR_FAIL"
              waited=$(( $(date +%s) - w0 ))
            done
            if [[ "$st" != *HOME* ]]; then tag=$(launch_diag); st="$st${tag:+ $tag}"; fi
            echo "${i}회차: 실행 $(( $(date +%s) - T0 ))초 뒤 첫 화면 ${st// /,}$([ "$waited" -gt 0 ] && echo " (더 본 시간 +${waited}초)") · 화면 ${PTW}x${PTH}pt"
            if [ "$LAUNCH_ONLY" = true ]; then
              if [[ "$st" == *HOME* ]]; then RESULTS+=("$i:LAUNCH_OK"); else RESULTS+=("$i:LAUNCH_NO_HOME(${st// /,})"); fi
              continue
            fi
            if ! open_link "/signup?mode=login" "$P-02"; then echo "${i}회차: 로그인 화면 링크를 못 열었다"; RESULTS+=("$i:OPENURL_FAIL"); continue; fi
            sleep 6
            shot "$P-03-login" || true
            st=$(state "$P-03-login") || st="OCR_FAIL"
            if [[ "$st" != *FORM_IDLE* ]]; then echo "${i}회차: 로그인 화면이 아니다(${st// /,})"; RESULTS+=("$i:NO_LOGIN_FORM(${st// /,})"); continue; fi
            # 입력칸은 '아이디 찾기'·'비밀번호를 잊으셨나요?' 보다 위에 있다 — 그 글자가 든 줄 중 맨 위를 누른다
            # (정확히 일치로 찾으면 iOS 26.5 에서 자리표시 글자를 못 찾았다 — 1회차 실측. 10/19 비공개 시험과 같은 방식)
            pos=$(web_pos id); [ -n "$pos" ] || pos=$(find_text "$P-03-login" 아이디 top)
            if [ -z "$pos" ] || ! tap_at "$pos"; then echo "${i}회차: 아이디 칸 못 누름"; RESULTS+=("$i:NO_ID_FIELD"); continue; fi
            sleep 1
            if ! axe type "$LOGIN_ID" --udid "$UDID" > /dev/null 2>&1; then echo "${i}회차: 아이디 입력 실패"; RESULTS+=("$i:TYPE_FAIL"); continue; fi
            sleep 1
            shot "$P-04-id" || true
            pos=$(web_pos pw); [ -n "$pos" ] || pos=$(find_text "$P-04-id" 비밀번호 top)
            if [ -z "$pos" ] || ! tap_at "$pos"; then echo "${i}회차: 비밀번호 칸 못 누름"; RESULTS+=("$i:NO_PW_FIELD"); continue; fi
            pw_pos="$pos"
            sleep 1
            if ! axe type "$LOGIN_PW" --udid "$UDID" > /dev/null 2>&1; then echo "${i}회차: 비밀번호 입력 실패"; RESULTS+=("$i:TYPE_FAIL"); continue; fi
            sleep 1
            # 심사자처럼 '로그인' 단추를 누른다. 키보드가 단추를 가릴 수 있어 먼저 제목 글자를 눌러 키보드를 내린다.
            # 단추를 못 찾으면 입력칸에 초점을 다시 준 뒤 엔터로 낸다(초점 없는 엔터는 아무것도 안 한다. 폼 안 어느 칸이든 엔터면 제출된다).
            # 키보드가 내려가면 화면이 움직일 수 있어 지금 화면에서 아이디 글자 위치를 다시 찾고, 못 찾을 때만 예전 비밀번호 칸 좌표를 쓴다(codex 지적).
            # 3초 안에 처리 중이 아니고 폼 그대로면 반대 방법으로 한 번만 다시 낸다(기준 시각은 그대로).
            enter_submit() {
              local fp
              shot "$P-enter" || true
              fp=$(web_pos id); [ -n "$fp" ] || fp=$(find_text "$P-enter" "$LOGIN_ID" top exact)
              tap_at "${fp:-$pw_pos}" || true
              sleep 1
              axe key 40 --udid "$UDID" > /dev/null 2>&1
            }
            shot "$P-05-pw" || true
            pos=$(web_pos title); [ -n "$pos" ] || pos=$(find_text "$P-05-pw" 계정에로그인하세요 top)
            if [ -n "$pos" ]; then tap_at "$pos" || true; sleep 1; fi
            shot "$P-06-ready" || true
            pos=$(web_pos login); [ -n "$pos" ] || pos=$(find_text "$P-06-ready" 로그인 bottom exact)
            if [ -n "$pos" ]; then
              TS=$(date +%s); tap_at "$pos" && how="button" || how="button-tap-failed"
            else
              enter_submit || true; TS=$(date +%s); how="return"
            fi
            final=""; trail=""; st=""; retried=""
            for t in 1 3 6 10 15 25 40 60; do
              now=$(( $(date +%s) - TS ))
              if [ "$now" -lt "$t" ]; then sleep $(( t - now )); fi
              el=$(( $(date +%s) - TS ))
              shot "$P-t$t" || true
              st=$(state "$P-t$t") || st="OCR_FAIL"
              trail="$trail +${el}s:${st// /,}"
              # 오류·홈이 확정 결과다 — '처리 중' 글자가 같이 보여도 먼저 끝낸다(agy 지적)
              case "$st" in
                *ERROR*) final="ERROR_at_${el}s(${st// /,})"; break ;;
                *HOME*) final="HOME_at_${el}s(${st// /,})"; break ;;
                *PROCESSING*) ;;
              esac
              if [ -z "$retried" ] && [ "$el" -le 3 ] && [[ "$st" == *FORM_IDLE* ]]; then
                retried=1
                if [[ "$how" == button* ]]; then
                  if enter_submit; then trail="$trail [다시 냄: 엔터 @${el}s]"; fi
                else
                  pos=$(web_pos login); [ -n "$pos" ] || pos=$(find_text "$P-t$t" 로그인 bottom exact)
                  if [ -n "$pos" ] && tap_at "$pos"; then trail="$trail [다시 냄: 단추 @${el}s]"; fi
                fi
              fi
            done
            if [ -z "$final" ]; then final="STILL_${st// /,}_at_$(( $(date +%s) - TS ))s"; fi
            alive || final="$final,APP_GONE"
            echo "${i}회차: 제출($how)$trail ⇒ $final"
            RESULTS+=("$i:$final")
          done
          stop_logs
          # ── 되풀이 뒤 한 번씩(codex 지적): 꺼진 앱을 링크로 켜기 · PASS 본인확인 창 열고 닫기(2번) ──
          EXTRAS=()
          if [ "$EXTRA" = true ] && [ "$LAUNCH_ONLY" != true ]; then
            # 콜드 스타트 링크 — SceneDelegate willConnectTo 의 urlContexts 를 SceneDelegateProxy 가 첫 화면 뒤에 넘기는 경로.
            # 켜져 있는 앱에 링크가 가면 콜드가 아니다 — 새로 띄운 앱의 PID 가 정말 사라진 것을 본 뒤에만 링크를 연다(codex 지적).
            P="x1"
            xcrun simctl launch --terminate-running-process "$UDID" "$APP_ID" > "$OUT/$P-prelaunch.txt" 2>&1 || true
            pid=$(sed -n "s/^$APP_ID: \([0-9][0-9]*\).*/\1/p" "$OUT/$P-prelaunch.txt" | head -1)
            sleep 8
            xcrun simctl terminate "$UDID" "$APP_ID" > /dev/null 2>&1 || true
            gone=""
            if [ -n "$pid" ]; then
              for k in $(seq 1 15); do
                if ! kill -0 "$pid" 2> /dev/null; then gone=1; break; fi
                sleep 1
              done
            fi
            if [ -z "$pid" ]; then
              st="NO_PID"; EXTRAS+=("콜드링크:FAIL(앱 PID 를 못 읽음)")
            elif [ -z "$gone" ]; then
              st="NOT_TERMINATED"; EXTRAS+=("콜드링크:FAIL(앱이 안 꺼짐)")
            else
              xcrun simctl spawn "$UDID" log stream --style compact --level info \
                --predicate 'process == "App" OR process BEGINSWITH "com.apple.WebKit"' > "$OUT/$P-syslog.txt" 2>&1 &
              LOGPID=$!
              if ! open_link "/signup?mode=login" "$P-01"; then
                st="OPENURL_FAIL"; EXTRAS+=("콜드링크:FAIL(링크 열기 실패)")
              else
                # 첫 실행은 수십 초 걸릴 수 있다 — 5초마다 보고 로그인 화면이 보이면 끝(최대 60초)
                st="OCR_FAIL"
                for k in $(seq 1 12); do
                  sleep 5
                  shot "$P-02-cold" || continue
                  dims "$P-02-cold" || true
                  st=$(state "$P-02-cold") || st="OCR_FAIL"
                  if [[ "$st" == *FORM_IDLE* ]]; then break; fi
                done
                # 로그인 단추까지 보여야 통과(아이디 찾기 화면도 로그인 화면 표지가 있어 FORM_NO_BUTTON 이 된다 — 그건 엉뚱한 화면)
                if [[ "$st" == *FORM_IDLE* ]]; then EXTRAS+=("콜드링크:OK"); else EXTRAS+=("콜드링크:FAIL(${st// /,})"); fi
              fi
            fi
            echo "추가 점검 · 꺼진 앱을 링크로 켜기 → ${st// /,}"
            stop_logs
            # PASS 본인확인 창(ASWebAuthenticationSession) — 창이 뜨는지·로그인 동의 창 없이(ephemeral)·닫으면 앱에 안내가 오는지.
            # 2번: 두 번째는 화면을 새로 열지 않고 같은 화면에서 다시 누른다(닫은 뒤 다시 열리는지 — codex 지적).
            P="x2"
            xcrun simctl spawn "$UDID" log stream --style compact --level info \
              --predicate 'process == "App" OR process BEGINSWITH "com.apple.WebKit"' > "$OUT/$P-syslog.txt" 2>&1 &
            LOGPID=$!
            if ! open_link "/find-id" "$P-01"; then
              EXTRAS+=("PASS창:FAIL(링크 열기 실패)")
              echo "추가 점검 · 아이디 찾기 화면 링크를 못 열었다"
            else
              sleep 6
              for j in 1 2; do
                R="$P-r$j"
                shot "$R-page" || true
                pos=$(web_pos pass); [ -n "$pos" ] || pos=$(find_text "$R-page" PASS로본인확인 top)
                if [ -z "$pos" ]; then
                  EXTRAS+=("PASS창${j}:FAIL(단추 없음)")
                  echo "추가 점검 · PASS ${j}번째 · 단추를 못 찾았다"
                  break
                fi
                tap_at "$pos" || true
                sleep 12
                shot "$R-session" || true
                ocr "$R-session" || true
                # 창의 주소 표시줄 글자(우리 다리 페이지·결제 대행사)로 창이 떴는지 본다. 'pass' 는 앱 화면 단추에도 있어 쓰지 않는다.
                sess=$(python3 - "$OUT/$R-session-ocr.txt" 2>> "$OUT/py-err.txt" <<'PY'
          import re, sys
          t = ''.join(l.rstrip('\n').split('\t', 2)[-1] for l in open(sys.argv[1], encoding='utf-8')).replace(' ', '').lower()
          # 주소 표시줄 글자 또는 창의 [Cancel]/[취소] 단추(웹 화면 아이디 찾기에는 없다 — AXe 화면 요소로 읽을 때 주소가 안 잡힐 수 있다)
          sheet = any(k in t for k in ('connecttrip.co.kr', 'portone', 'iamport', 'kcp', 'inicis', 'danal', 'cancel', '취소'))
          print(('SHEET' if sheet else 'NO_SHEET') + (' CONSENT' if re.search(r'signin|로그인하려고|wantstouse', t) else ''))
          PY
                ) || sess="OCR_FAIL"
                # 글자로 창을 못 알아봤으면(macOS 27 — 글자 인식이 안 되고 창 안은 AXe 로 안 보인다) 누르기 전 화면과 비교한다 —
                # 창이 덮으면 화면 대부분이 바뀐다(창 없이 같은 화면이면 거의 안 바뀐다). 최종 통과는 아래 '닫은 뒤 안내 문구'까지 봐야 한다.
                if [[ "$sess" != SHEET* ]]; then
                  chg=$("$RUNNER_TEMP/imgdiff" "$OUT/$R-page.png" "$OUT/$R-session.png" 2> /dev/null || true)
                  if [ -n "$chg" ] && awk -v c="$chg" 'BEGIN { exit !(c >= 0.25) }'; then
                    rest=""
                    if [[ "$sess" == *CONSENT* ]]; then rest=" CONSENT"; fi
                    sess="SHEET_BY_CHANGE(${chg})${rest}"
                  else
                    sess="${sess}(화면변화${chg:-?})"
                  fi
                fi
                # 창 닫기: 이름(Cancel/취소/Close/닫기 — iOS 27 창은 X 아이콘)으로, 안 되면 iPhone 17 Pro 실측 좌표(38,110)를 지금 화면 크기에 맞춰 누른다
                how="label"
                if ! axe tap --label "Cancel" --element-type Button --wait-timeout 3 --udid "$UDID" > /dev/null 2>&1 \
                  && ! axe tap --label "취소" --element-type Button --wait-timeout 2 --udid "$UDID" > /dev/null 2>&1 \
                  && ! axe tap --label "Close" --element-type Button --wait-timeout 2 --udid "$UDID" > /dev/null 2>&1 \
                  && ! axe tap --label "닫기" --element-type Button --wait-timeout 2 --udid "$UDID" > /dev/null 2>&1; then
                  how="xy"
                  tap_at "$(( 38 * PTW / 402 )) $(( 110 * PTH / 874 ))" || how="xy-fail"   # 재시도 있는 도우미(agy 지적)
                fi
                sleep 6
                shot "$R-after" || true
                ocr "$R-after" || true
                if app_state "$R-after"; then
                  closed=$(python3 -c 'import json, sys; s = json.load(open(sys.argv[1], encoding="utf-8")); print("CLOSED_MSG" if "본인확인창을닫았어요" in (s.get("text") or "") else "NO_MSG")' \
                    "$OUT/$R-after-state.json" 2>> "$OUT/py-err.txt") || closed="STATE_FAIL"
                else
                  closed=$(python3 - "$OUT/$R-after-ocr.txt" 2>> "$OUT/py-err.txt" <<'PY'
          import sys
          t = ''.join(l.rstrip('\n').split('\t', 2)[-1] for l in open(sys.argv[1], encoding='utf-8')).replace(' ', '')
          print('CLOSED_MSG' if '본인확인창을닫았어요' in t else 'NO_MSG')
          PY
                  ) || closed="OCR_FAIL"
                fi
                if [[ "$sess" == SHEET* ]] && [[ "$sess" != *CONSENT* ]] && [ "$closed" = CLOSED_MSG ]; then
                  EXTRAS+=("PASS창${j}:OK")
                else
                  EXTRAS+=("PASS창${j}:FAIL(${sess// /,},$closed,닫기=$how)")
                fi
                echo "추가 점검 · PASS ${j}번째 → ${sess// /,} · 닫기 $how · 닫은 뒤 $closed"
              done
            fi
            stop_logs
          fi
          # ── 합격 판정(codex 지적 — 진단만 모으지 말고 실패면 잡을 실패로) ──
          #   실행만: 모두 LAUNCH_OK / 확인 모드: 모두 15초 안에 ERROR_INVALID / 실제 로그인: 모두 HOME / 추가 점검: 모두 OK
          NFAIL=0; FAILS=""
          re='^ERROR_at_([0-9]+)s'
          for r in ${RESULTS[@]+"${RESULTS[@]}"}; do
            v="${r#*:}"; ok=""
            if [ "$LAUNCH_ONLY" = true ]; then
              [ "$v" = LAUNCH_OK ] && ok=1
            elif [ "$KIND" = probe ]; then
              if [[ "$v" =~ $re ]] && [[ "$v" == *ERROR_INVALID* ]] && [ "${BASH_REMATCH[1]}" -le 15 ]; then ok=1; fi
            else
              [[ "$v" == HOME_at_* ]] && ok=1
            fi
            # 결과가 맞아도 앱이 죽었으면 실패다(codex 지적 — 'ERROR_at_4s(…),APP_GONE' 이 통과하던 길)
            if [[ "$v" == *APP_GONE* ]]; then ok=""; fi
            if [ -z "$ok" ]; then NFAIL=$(( NFAIL + 1 )); FAILS="$FAILS $r"; fi
          done
          for e in ${EXTRAS[@]+"${EXTRAS[@]}"}; do
            if [[ "$e" != *:OK ]]; then NFAIL=$(( NFAIL + 1 )); FAILS="$FAILS $e"; fi
          done
          {
            echo "### iOS 시뮬레이터 로그인 시험"
            echo "- 모드: $MODE"
            echo "- 시뮬레이터: $DEV · $RT · 실행 뒤 대기 ${SW}초"
            echo "- 빌드: $CONF, $BUILD_XCODE"
            echo "- 글자 인식: $( { grep -o 'ocr-method [a-z-]*' "$OUT/ocr-err.txt" 2> /dev/null || true; } | sort | uniq -c | awk '{ print $3 " " $1 "회" }' | paste -sd ',' - )"
            # bash 3.2 + set -u 에서 빈 배열도 안전하게
            for r in ${RESULTS[@]+"${RESULTS[@]}"}; do echo "- $r"; done
            for e in ${EXTRAS[@]+"${EXTRAS[@]}"}; do echo "- 추가: $e"; done
            if [ "$NFAIL" -eq 0 ]; then echo "- 판정: 통과"; else echo "- 판정: 실패 ${NFAIL}건 —$FAILS"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY" "$OUT/summary.txt"
          if [ "$NFAIL" -gt 0 ]; then echo "::error::시험 실패 ${NFAIL}건"; exit 1; fi

      - name: 진단 묶음 암호화(공개 키)
        id: encrypt
        if: always()
        run: |
          if [ -n "${APP:-}" ]; then rm -f "$APP/GoogleService-Info.plist"; fi
          mkdir -p "$RUNNER_TEMP/up"
          if [ ! -d "$OUT" ]; then echo "진단 폴더 없음"; exit 1; fi
          cat > "$RUNNER_TEMP/diag_pub.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAoX8l8wdWze6zyq7rVWtQ
          V+7JyFGPapjxEyfJ5wmB4hNBE2VjYrzXoSfJ8T3/jDmllMGnCd24masG6IxqRvDs
          aXkjzp+/UCbSTxSDhWOVsHDx7rDh45vh8aDWtkmVaJ4eRNS3mVxrrOrcgHqR731W
          n8z/fXi+VKxK0fL8clq5ANBAYLborBAeFQay0vGY7yzDKntPr7J4KLAlNCaGEVl/
          LRy5klpwQzmxbGlLkyvecNQ0AtW/vGe7WQDJYZ/8OWox/WXiPi+g/DseUEghEfVh
          AjAFmgdCab4U4hb9FT8Igzjey3iFevMWIJgg4WCNY18M2ffQIfNC/8yHzYjvItt0
          pywF8euqxUSjC6zK1aA6xUP57JFYXB+aWd176wUbC3CprmwezLCVkUVBTS5L6DIM
          XgIkPzvBKL225+31fe3WO0K10O52rclycSllPsy4BqhaOmiQTyfLHVyeUDBtQhGP
          3UpMbagu6SYdmBqNJ75JmzIB4HiXe2g20RjUupgJhXoivOAQN+p65guE9Y2Xk9L1
          hHhAVYwSr1ERl5Eoi1gwUHrawuZBRZhzDyN265QiX4gzggNbr9fCrp1/09XdR1rf
          GSuQZneH23mO5eJBBnAzP4mBYW5acV+PAoSvlkp8Uxn62UYMurU2KPV8ZYLaGl24
          jUPZ6+zAw2kjoT8HCgjhYgECAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          tar czf "$RUNNER_TEMP/diag.tar.gz" -C "$(dirname "$OUT")" "$(basename "$OUT")"
          # 키는 한 줄 16진 문자열(파일 첫 줄을 비밀번호로 읽는 -pass file: 에 맞춘다). 다 된 뒤에만 올릴 이름으로 옮긴다.
          openssl rand -hex 32 > "$RUNNER_TEMP/k.txt"
          openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass file:"$RUNNER_TEMP/k.txt" \
            -in "$RUNNER_TEMP/diag.tar.gz" -out "$RUNNER_TEMP/diag.tar.gz.enc.part"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/diag_pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/k.txt" -out "$RUNNER_TEMP/diag.key.enc.part"
          rm -f "$RUNNER_TEMP/k.txt" "$RUNNER_TEMP/diag.tar.gz"
          mv "$RUNNER_TEMP/diag.tar.gz.enc.part" "$RUNNER_TEMP/up/diag.tar.gz.enc"
          mv "$RUNNER_TEMP/diag.key.enc.part" "$RUNNER_TEMP/up/diag.key.enc"
          ls -l "$RUNNER_TEMP/up"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.encrypt.outcome == 'success' }}
        with:
          name: ios-sim-login-diag-${{ inputs.runner }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/up/diag.tar.gz.enc
            ${{ runner.temp }}/up/diag.key.enc
          retention-days: 3
          if-no-files-found: error

      - name: 정리
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/simapp" "$OUT" "$RUNNER_TEMP/up" "$RUNNER_TEMP/diag.tar.gz" "$RUNNER_TEMP/k.txt" "$RUNNER_TEMP"/*.part
          xcrun simctl delete "ct-login-$GITHUB_RUN_ID" > /dev/null 2>&1 || true
