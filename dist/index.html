  <script>
    // 화면 배율 고정(2026-10-18 쿠마님 11991 "화면이 확대되면서 지멋대로, 글자가 짤려서 좌우 아래위로 옮기면서 봐야").
    // 아이폰(사파리·앱)은 16px 보다 작은 글자 칸을 누르면 화면을 확대하고 되돌리지 않는다 → 최대 배율 1로 막는다
    // (사파리는 그래도 두 손가락 확대를 허용한다). 앱(Capacitor, 아이폰·안드로이드)은 두 손가락 확대도 막아 비율을 고정한다.
    // 안드로이드 크롬·PC 웹은 그대로 둔다(확대가 필요한 사람의 접근성). 이 줄은 화면을 그리기 전에 돈다.
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var ios = /iP(hone|ad|od)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        var app = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (!ios && !app) return;
        var m = document.querySelector('meta[name="viewport"]');
        if (m) m.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0' + (app ? ', user-scalable=no' : '') + ', viewport-fit=cover');
      } catch (e) { /* 배율 고정 실패해도 화면은 그대로 뜬다 */ }
    })();
  </script>

  <script>
    // 첫 화면 계절 사진(2026-10-22 쿠마님 테스트 의견) — src/lib/heroPhotos.js 와 같은 규칙으로 첫 페인트 전에 한 장 고르고
    // (한국 시간 달 → 계절, 그 계절 사진 중 무작위, 폭 768 이하는 폰용 -m), 홈('/')으로 들어왔으면 미리 받는다.
    // 앱은 사진을 번들에 넣지 않고 사이트 주소로 불러온다. C(기본 장수)나 규칙을 바꾸면 heroPhotos.js·public/hero/manifest.json 도 같이 — heroPhotos.test.js 가 맞춰 본다.
    (function () {
      try {
        var C = {"spring":6,"summer":6,"autumn":6,"winter":6};
        try {
          // 마지막으로 받아 둔 장수(public/hero/manifest.json, heroPhotos.js refreshHeroCounts) — 사진을 늘려도 앱 업데이트 없이 반영
          var sv = JSON.parse(localStorage.getItem('ct_hero_counts') || 'null');
          if (sv && ['spring', 'summer', 'autumn', 'winter'].every(function (k) { return sv[k] >= 1 && sv[k] <= 60 && sv[k] % 1 === 0; })) C = sv;
        } catch (e2) { /* 기본 장수로 */ }
        var m = new Date(Date.now() + 9 * 3600 * 1000).getUTCMonth() + 1;
        var s = m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter';
        var n = Math.min(C[s], Math.floor(Math.random() * C[s]) + 1);
        var app = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        var u = (app ? 'https://www.connecttrip.co.kr' : '') + '/hero/' + s + '-' + (n < 10 ? '0' : '') + n + (window.innerWidth <= 768 ? '-m' : '') + '.webp';
        window.__CT_HERO__ = u;
        if (location.pathname === '/' || location.pathname === '/index.html') {
          var l = document.createElement('link');
          l.setAttribute('rel', 'preload'); l.setAttribute('as', 'image'); l.setAttribute('href', u); l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        }
      } catch (e) { /* 실패하면 Hero.jsx 가 직접 고른다 */ }
    })();
  </script>

  <!-- 폰트: 과거엔 index.css 의 @import 로 불러와 (HTML→번들CSS→폰트CSS→woff2) 4단 요청 체인이
       전부 렌더를 막았다. head 의 link 로 올려 폰트 CSS 를 번들 CSS 와 병렬로 받게 한다.
       preconnect 2줄 = 폰트 CSS(비-CORS)와 woff2(CORS)가 서로 다른 커넥션 풀을 쓰기 때문.
       static 판(가중치별 풀 woff2 약 770KB × 6종)이 아니라 variable dynamic-subset 판을 쓴다

       img 태그에 crossorigin 속성이 없어 비-CORS 요청이므로 preconnect 도 crossorigin 없이 건다
       (붙이면 다른 커넥션 풀이라 재사용되지 않는다). dns-prefetch 는 preconnect 미지원 대비 폴백. -->

  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <script>
    // 오래된 서비스워커·캐시 정리. 스테일 번들이 남는 것을 막는 장치다.
    // (앱(Capacitor)에서는 실행하지 않는다.)
    //
    // 2026-09-04: 전면 제거에서 **스코프 필터**로 바꿨다. 플래너는 /planner 스코프 전용

    if ('serviceWorker' in navigator && !window.Capacitor?.isNativePlatform?.()) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(reg) {
          var scope = (reg.scope || '');
          if (scope.indexOf('/planner') === -1) reg.unregister();
        });
      });
      caches.keys().then(function(names) {
        names.forEach(function(name) {
          if (name.indexOf('ct-planner-') !== 0) caches.delete(name);
        });
      });
    }
